const $=id=>document.getElementById(id), adminUID='7q6BobGC1HgGO6g6I4qGHl9aAxw2';
let config=null,slot=null,receipts=[],unsub=[],audio=null,timer=null,muted=true;

function show(markup,close=true){$('paper').innerHTML=(close?'<button class="close" id="close" aria-label="닫기">×</button>':'')+'<div class="orn">❧ ✦ ❧</div>'+markup;$('modal').hidden=false;if(close)$('close').onclick=hide}

function tone(freq=880,vol=.025,d=.25){if(muted||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}

for(let i=0;i<10;i++){const f=document.createElement('i');f.className='flake';f.style.cssText='left:'+Math.random()*100+'%;width:2px;height:2px;animation-duration:'+(10+Math.random()*10)+'s;animation-delay:-'+Math.random()*20+'s';$('map').append(f)}

// Two registered image states share identical geometry. The unlit state is

const windows=[[0.275,0.2,0.311,0.242],[0.225,0.282,0.261,0.319],[0.341,0.282,0.371,0.322],[0.831,0.219,0.861,0.253],[0.061,0.409,0.343,0.511],[0.611,0.474,0.69,0.523],[0.886,0.488,0.91,0.515],[0.143,0.676,0.18,0.715],[0.445,0.71,0.567,0.783],[0.796,0.661,0.838,0.7],[0.83,0.746,0.865,0.787]], owners=[0,0,0,1,2,3,3,4,5,6,6];
const canvas=document.createElement('canvas');canvas.className='window-layer';canvas.setAttribute('aria-hidden','true');$('map').prepend(canvas);
const original=new Image();let litPixels=null,darkPixels=null,ctx=null;
original.onload=()=>{canvas.width=original.naturalWidth;canvas.height=original.naturalHeight;ctx=canvas.getContext('2d');ctx.drawImage(original,0,0);litPixels=ctx.getImageData(0,0,canvas.width,canvas.height);darkPixels=ctx.createImageData(canvas.width,canvas.height);darkPixels.data.set(litPixels.data);const w=canvas.width,h=canvas.height;for(const [x0,y0,x1,y1] of windows){for(let y=Math.floor(y0*h);y<Math.ceil(y1*h);y++)for(let x=Math.floor(x0*w);x<Math.ceil(x1*w);x++){const k=(y*w+x)*4,r=litPixels.data[k],g=litPixels.data[k+1],b=litPixels.data[k+2];const warm=Math.max(0,Math.min(1,(r-b-14)/45))*Math.max(0,Math.min(1,(r-95)/65));const edge=Math.min(1,(x-x0*w)/3,(x1*w-x)/3,(y-y0*h)/3,(y1*h-y)/3);const a=Math.max(0,warm*edge)*.96;const l=.299*r+.587*g+.114*b;darkPixels.data[k]=r*(1-a)+l*.40*a;darkPixels.data[k+1]=g*(1-a)+l*.43*a;darkPixels.data[k+2]=b*(1-a)+l*.55*a;}}paintWindows();};
function paintWindows(){if(!ctx||!darkPixels)return;ctx.putImageData(darkPixels,0,0);windows.forEach(([x0,y0,x1,y1],i)=>{if(!receipts.some(r=>r.from===slot&&r.to===String(owners[i])))return;const w=canvas.width,h=canvas.height,x=Math.floor(x0*w),y=Math.floor(y0*h);ctx.putImageData(litPixels,0,0,x,y,Math.ceil(x1*w)-x,Math.ceil(y1*h)-y)});}
const imageCSS=getComputedStyle($('map')).backgroundImage;original.src=imageCSS.slice(5,-2);

function render(){paintWindows();document.querySelectorAll('.house').forEach(e=>e.remove());if(!config){$('progress').textContent='팀장 메뉴에서 마을 설정을 먼저 저장해 주세요.';return}config.names.forEach((name,i)=>{const b=document.createElement('button');b.className='house'+(receipts.some(r=>r.from===slot&&r.to===String(i))?' sent':'');b.style.left=coords[i][0]+'%';b.style.top=coords[i][1]+'%';b.innerHTML='<span>'+esc(name)+'</span>';b.setAttribute('aria-label',name+'의 집');b.onclick=()=>{tone();visit(String(i))};$('map').append(b)});$('progress').textContent=config.open?'마음이 도착했어요. 각자의 집에서 편지를 읽어보세요.':'마을에 도착한 편지 '+receipts.length+' / 42통';$('enter').textContent=slot!==null?config.names[Number(slot)]+' · 입장 완료':'마을 입장하기';}
async function join(){try{if(!auth.currentUser)await signInAnonymously(auth);const snap=await getDoc(cfg);if(!snap.exists()){show('<h2>마을을 준비하고 있어요</h2><p>팀장이 일곱 채의 집에 이름을 달고 있어요. 팀장이라면 아래 메뉴에서 마을 설정을 먼저 저장해 주세요.</p><button id="setup">팀장 메뉴</button>');$('setup').onclick=()=>{$('admin').click()};return}config=snap.data();const m=await getDoc(doc(db,'members',auth.currentUser.uid));if(m.exists()){slot=m.data().slot;render();return}show('<h2>마을에 오신 것을 환영해요</h2><p>본인의 이름을 직접 입력해 주세요.</p><input id="name" type="text" placeholder="이름 입력" autocomplete="off" maxlength="20" aria-label="본인 이름"><p id="err" class="status" aria-live="polite"></p><button id="join">마을 입장하기</button>');$('name').addEventListener('keydown',e=>{if(e.key==='Enter')$('join').click()});$('join').onclick=async()=>{const entered=$('name').value.trim().normalize('NFC');const i=config.names.findIndex(n=>n.trim().normalize('NFC')===entered);if(i<0){$('err').textContent='등록된 이름과 일치하지 않아요. 이름을 다시 확인해 주세요.';return}const s=String(i);$('join').disabled=true;try{await setDoc(doc(db,'members',auth.currentUser.uid),{slot:s});slot=s;listenReceipts();render();show('<h2>우리의 마지막 마음 나눔</h2><p>그동안 우리는 누군가의 이야기를 듣고,<br>마음을 나누며 작은 온기를 전해왔습니다.<br><br>이제는 함께 걸어온 서로에게<br>따뜻한 마음을 전해보려 합니다.<br><br>서로의 이름이 적힌 집에 마음을 남겨주세요.<br>우리의 마지막 활동이 따뜻한 기억으로 남을 수 있도록.</p><button id="welcome">마을로 들어가기</button>',false);$('welcome').onclick=hide}catch(e){error(e);if($('join'))$('join').disabled=false}}}catch(e){error(e)}}
$('enter').onclick=()=>{join()};
let ru=null;function listenReceipts(){if(ru)ru();if(slot!==null)ru=onSnapshot(collection(db,'receipts'),s=>{receipts=s.docs.map(d=>d.data());render()},error)}
onAuthStateChanged(auth,async u=>{unsub.forEach(f=>f());unsub=[];if(ru){ru();ru=null}slot=null;receipts=[];if(!u)return;try{const m=await getDoc(doc(db,'members',u.uid));if(m.exists())slot=m.data().slot;unsub.push(onSnapshot(cfg,s=>{config=s.exists()?s.data():null;render()},error));listenReceipts();if(slot===null&&u.isAnonymous&&!sessionStorage.getItem('entryShown')){sessionStorage.setItem('entryShown','1');await join()}}catch(e){error(e)}});
async function visit(to){if(slot===null){join();return}if(config.open){if(to!==slot){show('<h2>편지가 도착했어요</h2><p>받은 편지는 자신의 집에서 읽어주세요.</p>');return}try{const ss=await getDocs(query(collection(db,'letters'),where('to','==',slot)));const letters=ss.docs.map(d=>d.data());let i=0;function page(){if(!letters.length){show('<h2>나의 편지함</h2><p>아직 도착한 편지가 없어요.</p>');return}const l=letters[i];show('<h2>To. '+esc(config.names[Number(slot)])+'</h2><p style="text-align:left;overflow-wrap:anywhere">'+esc(l.body)+'</p><div class="from">From. '+esc(config.names[Number(l.from)])+'</div><div class="actions"><button id="prev" '+(i===0?'disabled':'')+'>이전</button><span>'+ (i+1)+' / '+letters.length+'</span><button id="next" '+(i===letters.length-1?'disabled':'')+'>다음</button></div>');$('prev').onclick=()=>{i--;page();tone(660)};$('next').onclick=()=>{i++;page();tone(660)}}page()}catch(e){error(e)}return}
if(to===slot){show('<h2>나의 집</h2><p>팀장이 편지를 공개하면 이곳에서 마음을 만나게 돼요.</p>');return}if(receipts.some(r=>r.from===slot&&r.to===to)){show('<h2>마음을 전했어요</h2><p>이미 편지를 보낸 집이에요.</p>');return}
let draft='';function compose(){show('<h2>To. '+esc(config.names[Number(to)])+'</h2><textarea id="body" maxlength="4000">'+esc(draft)+'</textarea><div class="from">From. '+esc(config.names[Number(slot)])+'</div><p class="status" id="err"></p><button id="send">마음 전하기</button>');$('send').onclick=()=>{draft=$('body').value.trim();if(!draft){$('err').textContent='마음을 한 줄이라도 적어주세요.';return}show('<h2>마음을 전할까요?</h2><p>한번 보낸 편지는 수정하거나 삭제할 수 없어요.</p><p class="status" id="err"></p><div class="actions"><button class="secondary" id="back">다시 읽기</button><button id="confirm">편지 보내기</button></div>');$('back').onclick=compose;$('confirm').onclick=async()=>{$('confirm').disabled=true;$('confirm').textContent='편지를 보내고 있어요…';$('back').disabled=true;try{const id=slot+'_'+to,b=writeBatch(db);b.set(doc(db,'letters',id),{from:slot,to,body:draft,created:serverTimestamp()});b.set(doc(db,'receipts',id),{from:slot,to});await b.commit();if(!receipts.some(r=>r.from===slot&&r.to===to))receipts.push({from:slot,to});render();tone(1046,.04,.8);show('<h2>마음이 도착했어요</h2><p>따뜻한 마음을 전해주셔서 고마워요.</p><button id="ok">마을로 돌아가기</button>');$('ok').onclick=hide}catch(e){error(e);if($('confirm')){$('confirm').disabled=false;$('confirm').textContent='편지 보내기';$('back').disabled=false}}}}}compose()}
$('photo').onclick=()=>{if(!config?.photo){show('<h2>추억의 액자</h2><p>사진을 준비하고 있어요.</p>');return}show('<h2>함께했던 우리</h2><img class="photo" alt="팀 단체사진" src="'+esc(config.photo)+'"><p>우리의 5기, 함께한 시간 ♡</p>')};
$('admin').onclick=()=>{if(auth.currentUser?.uid===adminUID){adminPanel();return}show('<h2>팀장 메뉴</h2><input id="email" type="email" placeholder="관리자 이메일"><input id="pw" type="password" placeholder="비밀번호"><p id="err" class="status"></p><button id="login">관리자 로그인</button>');$('login').onclick=async()=>{try{const u=await signInWithEmailAndPassword(auth,$('email').value,$('pw').value);if(u.user.uid!==adminUID){await signOut(auth);throw Error('not admin')}adminPanel()}catch(e){error(e)}}};
async function adminPanel(){try{const s=await getDoc(cfg);config=s.exists()?s.data():null;show('<h2>마을 관리</h2><p>집 순서: 위 왼쪽, 위 오른쪽, 가운데 왼쪽, 가운데 오른쪽, 아래 왼쪽, 아래 가운데, 아래 오른쪽</p><textarea id="names" placeholder="팀원 이름 7개, 한 줄에 하나씩">'+esc(config?.names.join('\n')||'')+'</textarea><input id="pic" type="file" accept="image/*"><p id="err" class="status"></p><div class="actions"><button id="save">마을 설정 저장</button><button id="publish" '+(!config||config.open?'disabled':'')+'>편지 전체 공개</button><button class="secondary" id="logout">로그아웃</button></div>');$('save').onclick=async()=>{try{const names=$('names').value.split('\n').map(s=>s.trim()).filter(Boolean);if(names.length!==7||new Set(names).size!==7)throw Error('7 names');let photo=config?.photo||'';const f=$('pic').files[0];if(f){const bmp=await createImageBitmap(f),c=document.createElement('canvas'),scale=Math.min(1,850/bmp.width);c.width=bmp.width*scale;c.height=bmp.height*scale;c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.75)}await setDoc(cfg,{names,photo,open:config?.open||false});$('err').textContent='저장 완료';config=(await getDoc(cfg)).data();$('publish').disabled=config.open;render()}catch(e){error(e)}};$('publish').onclick=async()=>{if(!confirm('편지를 공개하고 작성을 마감할까요?'))return;try{await setDoc(cfg,{...config,open:true});hide();status('편지가 공개됐어요.')}catch(e){error(e)}};$('logout').onclick=async()=>{await signOut(auth);hide();location.reload()}}catch(e){error(e)}}
signInAnonymouslyIfNeeded();async function signInAnonymouslyIfNeeded(){await auth.authStateReady();if(!auth.currentUser)try{await signInAnonymously(auth)}catch(e){error(e)}}
