<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>마음이 머무는 마을</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap"><style>
*{box-sizing:border-box}body{margin:0;background:#323a53;color:#f8efe0;font-family:Pretendard,sans-serif}button,select,textarea,input{font:inherit}button{cursor:pointer;border:0;border-radius:24px;padding:12px 20px;background:#85454b;color:#fff8ed}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:3px solid #d8af79}main{max-width:650px;margin:auto;min-height:100dvh;background:#45465d}header{text-align:center;padding:25px 15px 17px;background:#353c53}h1{font-family:MaruBuri,'Gowun Batang',serif;font-size:clamp(25px,6vw,38px);margin:12px 0 8px;font-weight:600}header p{font-size:13px;letter-spacing:.12em;margin:0;color:#e0d2c7}.tools{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px}.tools button{background:transparent;border:1px solid #b9adad;padding:7px 12px}.map{position:relative;aspect-ratio:3/4;background:#666b84 url('village.webp') center/100% 100% no-repeat;isolation:isolate;overflow:hidden}.house{position:absolute;transform:translate(-50%,-50%);background:transparent;padding:0;width:31%;height:20%;border-radius:20px;display:flex;align-items:end;justify-content:center}.house span{background:#f7ead3;color:#53403c;box-shadow:0 2px 7px #382b4144;border:1px solid #bfa784;border-radius:7px;padding:6px 10px;font-family:MaruBuri,serif;font-weight:600;font-size:clamp(12px,3.4vw,17px);white-space:nowrap}.house.sent span:after{content:' ✓';color:#58765b}.house.sent:before{content:'';position:absolute;inset:20% 15%;background:radial-gradient(ellipse,#ffe6a52b,transparent 70%);pointer-events:none}.flake{position:absolute;top:-10px;background:#fff;border-radius:50%;pointer-events:none;opacity:.45;animation:fall linear infinite;z-index:2}@keyframes fall{to{transform:translate(20px,650px);opacity:0}}@media(prefers-reduced-motion:reduce){.flake{display:none}*{animation:none!important}}footer{padding:18px;text-align:center;font-size:13px;color:#ebddce}.overlay{position:fixed;inset:0;background:#202638b0;display:grid;place-items:center;z-index:10;padding:16px;overflow:auto}.overlay[hidden]{display:none}.paper{position:relative;width:min(100%,440px);max-height:90dvh;overflow:auto;background:radial-gradient(ellipse at 0 0,#e9d5b6,transparent 40%),linear-gradient(135deg,#fff5e5,#f3e5ce);border:1px solid #c7ad88;border-radius:12px;padding:26px;color:#63443e;box-shadow:0 12px 60px #171a2b80;text-align:center}.paper h2{font-family:MaruBuri,'Gowun Batang',serif;font-size:24px;margin:12px 0}.paper p{font-family:'Gowun Batang',serif;line-height:1.9;white-space:pre-wrap}.paper .orn{color:#71806a;letter-spacing:.5em;font-size:23px}.paper textarea{width:100%;min-height:220px;resize:vertical;background:repeating-linear-gradient(transparent 0 31px,#bda58a55 31px 32px);border:1px solid #d6bea0;border-radius:6px;color:#533b36;font-family:'Gowun Batang',serif;font-size:17px;line-height:32px;padding:10px}.paper select,.paper input{width:100%;padding:13px;border:1px solid #c5ad90;background:#fff9ec;border-radius:8px;margin:8px 0;color:#493b37}.paper .from{font-family:'Nanum Pen Script',cursive;font-size:25px;text-align:right}.paper .close{position:absolute;right:8px;top:8px;background:transparent;color:#694b45;padding:8px}.actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}.secondary{background:#e3d3bc;color:#66483f}.status{font-size:13px;min-height:20px;color:#e6d8c9}.paper .status{color:#93494c}.photo{max-width:100%;border:8px solid #fff9eb;box-shadow:0 2px 10px #60493e44}.envelope{font-size:64px;animation:deliver 1s ease both}@keyframes deliver{from{transform:translateY(30px);opacity:0}to{transform:translateY(-12px);opacity:1}}[hidden]{display:none!important}
</style></head><body><main><header><div class="tools"><button id="photo">추억의 액자</button><button id="sound" aria-pressed="false">♫ BGM 꺼짐</button></div><h1>마음이 머무는 마을</h1><p>우리의 마지막 마음 나눔</p></header><div class="map" id="map"></div><footer><div id="progress">마을을 준비하고 있어요.</div><div class="status" id="status"></div><button id="enter">마을 입장하기</button> <button id="admin" class="secondary">팀장 메뉴</button></footer></main><div class="overlay" id="modal" hidden><section class="paper" role="dialog" aria-modal="true" aria-label="마음 편지" id="paper"></section></div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import {getAuth,signInAnonymously,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,onSnapshot,collection,query,where,getDocs,writeBatch,serverTimestamp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyBo5VzpBRA1m5kbtzXNti7sbzp8tSW3FoE",authDomain:"warm-winter-village.firebaseapp.com",projectId:"warm-winter-village",storageBucket:"warm-winter-village.firebasestorage.app",messagingSenderId:"789046962003",appId:"1:789046962003:web:36841a41c3f037eff1a3a6"}),auth=getAuth(app),db=getFirestore(app),cfg=doc(db,'village','config');
const $=id=>document.getElementById(id), adminUID='7q6BobGC1HgGO6g6I4qGHl9aAxw2';
let config=null,slot=null,receipts=[],unsub=[],audio=null,timer=null,muted=true;
const coords=[[25,31],[77,30],[20,51],[76,54],[16,73],[51,78],[86,79]];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(markup,close=true){$('paper').innerHTML=(close?'<button class="close" id="close" aria-label="닫기">×</button>':'')+'<div class="orn">❧ ✦ ❧</div>'+markup;$('modal').hidden=false;if(close)$('close').onclick=hide}
function hide(){$('modal').hidden=true}
function status(s){$('status').textContent=s}
function error(e){console.error(e);status('연결 또는 권한을 확인해 주세요.');const node=$('err');if(node)node.textContent='저장하지 못했어요. 연결 및 권한을 확인한 뒤 다시 시도해 주세요.'}
function tone(freq=880,vol=.025,d=.25){if(muted||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function music(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();muted=false;$('sound').textContent='♫ BGM 켜짐';$('sound').setAttribute('aria-pressed','true');if(timer)return;const rate=audio.sampleRate,buf=audio.createBuffer(1,Math.floor(rate*.19),rate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++){let t=i/rate;data[i]=(Math.random()*2-1)*Math.exp(-t*30)}function jingle(){if(muted)return;for(let k=0;k<3;k++){const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),g=audio.createGain();src.buffer=buf;filter.type='bandpass';filter.frequency.value=3200+k*850;filter.Q.value=2.5;g.gain.value=.035;src.connect(filter).connect(g).connect(audio.destination);src.start(audio.currentTime+k*.055)}}jingle();timer=setInterval(jingle,780)}
function stop(){muted=true;clearInterval(timer);timer=null;$('sound').textContent='♫ BGM 꺼짐';$('sound').setAttribute('aria-pressed','false')}
$('sound').onclick=()=>muted?music():stop();
for(let i=0;i<18;i++){const f=document.createElement('i');f.className='flake';f.style.cssText='left:'+Math.random()*100+'%;width:2px;height:2px;animation-duration:'+(10+Math.random()*10)+'s;animation-delay:-'+Math.random()*20+'s';$('map').append(f)}
function render(){document.querySelectorAll('.house').forEach(e=>e.remove());if(!config)return;config.names.forEach((name,i)=>{const b=document.createElement('button');b.className='house'+(receipts.some(r=>r.from===slot&&r.to===String(i))?' sent':'');b.style.left=coords[i][0]+'%';b.style.top=coords[i][1]+'%';b.innerHTML='<span>'+esc(name)+'</span>';b.setAttribute('aria-label',name+'의 집');b.onclick=()=>{tone();visit(String(i))};$('map').append(b)});$('progress').textContent=config.open?'마음이 도착했어요. 각자의 집에서 편지를 읽어보세요.':'마을에 도착한 편지 '+receipts.length+' / 42통';$('enter').textContent=slot!==null?config.names[Number(slot)]+' · 입장 완료':'마을 입장하기';}
async function join(){try{if(!auth.currentUser)await signInAnonymously(auth);const snap=await getDoc(cfg);if(!snap.exists()){status('팀장이 마을을 준비하고 있어요.');return}config=snap.data();const m=await getDoc(doc(db,'members',auth.currentUser.uid));if(m.exists()){slot=m.data().slot;render();return}show('<h2>마을에 오신 것을 환영해요</h2><p>본인의 이름을 선택해 주세요.</p><select id="name">'+config.names.map((n,i)=>'<option value="'+i+'">'+esc(n)+'</option>').join('')+'</select><p id="err" class="status"></p><button id="join">마을 입장하기</button>');$('join').onclick=async()=>{try{const s=$('name').value;await setDoc(doc(db,'members',auth.currentUser.uid),{slot:s});slot=s;listenReceipts();render();show('<h2>우리의 마지막 마음 나눔</h2><p>그동안 우리는 누군가의 이야기를 듣고, 마음을 나누며 작은 온기를 전해왔습니다.<br><br>이제는 함께 걸어온 서로에게 따뜻한 마음을 전해보려 합니다.<br><br>일곱 개의 집에 마음을 남겨주세요.<br>우리의 마지막 활동이 따뜻한 기억으로 남을 수 있도록.</p><button id="welcome">마을로 들어가기</button>',false);$('welcome').onclick=hide}catch(e){error(e)}}}catch(e){error(e)}}
$('enter').onclick=()=>{join()};
let ru=null;function listenReceipts(){if(ru)ru();if(slot!==null)ru=onSnapshot(collection(db,'receipts'),s=>{receipts=s.docs.map(d=>d.data());render()},error)}
onAuthStateChanged(auth,async u=>{unsub.forEach(f=>f());unsub=[];if(ru){ru();ru=null}slot=null;receipts=[];if(!u)return;try{const m=await getDoc(doc(db,'members',u.uid));if(m.exists())slot=m.data().slot;unsub.push(onSnapshot(cfg,s=>{config=s.exists()?s.data():null;render()},error));listenReceipts()}catch(e){error(e)}});
async function visit(to){if(slot===null){join();return}if(config.open){if(to!==slot){show('<h2>편지가 도착했어요</h2><p>받은 편지는 자신의 집에서 읽어주세요.</p>');return}try{const ss=await getDocs(query(collection(db,'letters'),where('to','==',slot)));const letters=ss.docs.map(d=>d.data());let i=0;function page(){if(!letters.length){show('<h2>나의 편지함</h2><p>아직 도착한 편지가 없어요.</p>');return}const l=letters[i];show('<h2>To. '+esc(config.names[Number(slot)])+'</h2><p style="text-align:left;overflow-wrap:anywhere">'+esc(l.body)+'</p><div class="from">From. '+esc(config.names[Number(l.from)])+'</div><div class="actions"><button id="prev" '+(i===0?'disabled':'')+'>이전</button><span>'+ (i+1)+' / '+letters.length+'</span><button id="next" '+(i===letters.length-1?'disabled':'')+'>다음</button></div>');$('prev').onclick=()=>{i--;page();tone(660)};$('next').onclick=()=>{i++;page();tone(660)}}page()}catch(e){error(e)}return}
if(to===slot){show('<h2>나의 집</h2><p>팀장이 편지를 공개하면 이곳에서 마음을 만나게 돼요.</p>');return}if(receipts.some(r=>r.from===slot&&r.to===to)){show('<h2>마음을 전했어요</h2><p>이미 편지를 보낸 집이에요.</p>');return}
let draft='';function compose(){show('<h2>To. '+esc(config.names[Number(to)])+'</h2><textarea id="body" maxlength="4000" placeholder="함께한 시간을 기억하며...">'+esc(draft)+'</textarea><div class="from">From. '+esc(config.names[Number(slot)])+'</div><p class="status" id="err"></p><button id="send">마음 전하기</button>');$('send').onclick=()=>{draft=$('body').value.trim();if(!draft){$('err').textContent='마음을 한 줄이라도 적어주세요.';return}show('<h2>마음을 전할까요?</h2><p>한번 보낸 편지는 수정하거나 삭제할 수 없어요.</p><p class="status" id="err"></p><div class="actions"><button class="secondary" id="back">다시 읽기</button><button id="confirm">편지 보내기</button></div>');$('back').onclick=compose;$('confirm').onclick=async()=>{$('confirm').disabled=true;try{const id=slot+'_'+to,b=writeBatch(db);b.set(doc(db,'letters',id),{from:slot,to,body:draft,created:serverTimestamp()});b.set(doc(db,'receipts',id),{from:slot,to});await b.commit();tone(1046,.04,.8);show('<div class="envelope">✉</div><h2>마음이 도착했어요</h2><p>따뜻한 마음을 전해주셔서 고마워요.</p><button id="ok">마을로 돌아가기</button>');$('ok').onclick=hide}catch(e){error(e);$('confirm').disabled=false}}}}compose()}
$('photo').onclick=()=>{if(!config?.photo){show('<h2>추억의 액자</h2><p>사진을 준비하고 있어요.</p>');return}show('<h2>함께했던 우리</h2><img class="photo" alt="팀 단체사진" src="'+esc(config.photo)+'"><p>우리의 5기, 함께한 시간 ♡</p>')};
$('admin').onclick=()=>{if(auth.currentUser?.uid===adminUID){adminPanel();return}show('<h2>팀장 메뉴</h2><input id="email" type="email" placeholder="관리자 이메일"><input id="pw" type="password" placeholder="비밀번호"><p id="err" class="status"></p><button id="login">관리자 로그인</button>');$('login').onclick=async()=>{try{const u=await signInWithEmailAndPassword(auth,$('email').value,$('pw').value);if(u.user.uid!==adminUID){await signOut(auth);throw Error('not admin')}adminPanel()}catch(e){error(e)}}};
async function adminPanel(){try{const s=await getDoc(cfg);config=s.exists()?s.data():null;show('<h2>마을 관리</h2><p>집 순서: 위 왼쪽, 위 오른쪽, 가운데 왼쪽, 가운데 오른쪽, 아래 왼쪽, 아래 가운데, 아래 오른쪽</p><textarea id="names" placeholder="팀원 이름 7개, 한 줄에 하나씩">'+esc(config?.names.join('\n')||'')+'</textarea><input id="pic" type="file" accept="image/*"><p id="err" class="status"></p><div class="actions"><button id="save">마을 설정 저장</button><button id="publish" '+(!config||config.open?'disabled':'')+'>편지 전체 공개</button><button class="secondary" id="logout">로그아웃</button></div>');$('save').onclick=async()=>{try{const names=$('names').value.split('\n').map(s=>s.trim()).filter(Boolean);if(names.length!==7||new Set(names).size!==7)throw Error('7 names');let photo=config?.photo||'';const f=$('pic').files[0];if(f){const bmp=await createImageBitmap(f),c=document.createElement('canvas'),scale=Math.min(1,850/bmp.width);c.width=bmp.width*scale;c.height=bmp.height*scale;c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.75)}await setDoc(cfg,{names,photo,open:config?.open||false});$('err').textContent='저장 완료';config=(await getDoc(cfg)).data();$('publish').disabled=config.open;render()}catch(e){error(e)}};$('publish').onclick=async()=>{if(!confirm('편지를 공개하고 작성을 마감할까요?'))return;try{await setDoc(cfg,{...config,open:true});hide();status('편지가 공개됐어요.')}catch(e){error(e)}};$('logout').onclick=async()=>{await signOut(auth);hide();location.reload()}}catch(e){error(e)}}
signInAnonymouslyIfNeeded();async function signInAnonymouslyIfNeeded(){await auth.authStateReady();if(!auth.currentUser)try{await signInAnonymously(auth)}catch(e){error(e)}}
</script></body></html>
